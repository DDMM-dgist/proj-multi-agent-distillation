[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "distillation-agents"
version = "0.1.0"
description = "Genericized multi-agent workflow for teacher->student MLIP distillation"
requires-python = ">=3.10"
dependencies = [
    # ase 3.23 is the first release with `ase.geometry.rdf`; 3.22 cannot import the
    # RDF adapter. Verified: the suite passes on ase 3.23.0-3.29.0 (min pinned in CI).
    "ase>=3.23",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

# Optional: the provider-neutral PydanticAI runtime adapter (runtimes/pydantic_ai/).
# The core workflow does NOT depend on these; install only to run the fourth runtime.
#   pip install -e .[pydantic-ai]
# Versions are pinned to the combination actually installed, imported, and tested
# (pydantic-ai-slim 0.8.1 with a real TestModel run, 2026-08-03). The opentelemetry-api
# upper bound is required: 1.44+ removed the private `opentelemetry._events` module that
# pydantic-ai-slim 0.8.x imports at load time.
[project.optional-dependencies]
pydantic-ai = [
    "pydantic>=2.0",
    "pydantic-ai-slim>=0.8,<0.9",
    "opentelemetry-api>=1.26,<1.44",
]
# Provider SDK for a real Anthropic call (manual smoke / shadow / authoritative run only).
# NOT needed for the network-free runtime tests. The upper bound is a tested-compatibility pin
# (0.65 relocated a symbol pydantic-ai-slim 0.8.x imports); revisit when the slim pin moves.
#   pip install -e ".[pydantic-ai,anthropic]"
anthropic = [
    "anthropic>=0.61,<0.65",
]
# Local, OpenAI-compatible inference backend (vLLM first; also Ollama and any OpenAI-compatible
# server). Pulls in the `openai` SDK that pydantic_ai's OpenAI/Ollama providers require. NO
# provider API key and NO Anthropic credential are needed for a locally served model — the
# providers inject a non-secret placeholder key. Connects over a base URL (PYDANTIC_AI_BASE_URL).
#   pip install -e ".[pydantic-ai,local-openai]"
local-openai = [
    "pydantic-ai-slim[openai]>=0.8,<0.9",
]

[project.scripts]
distill-run = "workflow.controller:main"
distill-acquire = "adapters.acquisition:main"
distill-step = "workflow.steps:main"
distill-agent = "orchestration.cli:main"
distill-agent-run = "runtimes.pydantic_ai.cli:main"

[tool.setuptools]
packages = ["adapters", "orchestration", "validation", "workflow", "runtimes.pydantic_ai"]

[tool.setuptools.data-files]
"share/distillation-agents/agent_specs" = ["agent_specs/*.yaml"]
"share/distillation-agents/agents" = ["agents/*.md"]

# Install in editable mode so project packages and the runtime-neutral agent
# registry remain available from run directories:
#   pip install -e .
