# SiO2 current-framework validation profile — DRAFT (2026-08-04)
# NOT registered with the controller. Requires human approval before freezing.
# Rule: committee-uncertainty 0.30 is DIAGNOSTIC (paper aspiration, not a required-pass) per
# gates/vote_v5.workflow.js:27,41. Physical observables with unresolved protocol/threshold are
# left required: false with threshold_provenance: UNRESOLVED — no invented values.

metadata:
  status: draft
  registered: false
  approved: false
  gate_execution_blocked: true
  gate_execution_blocked_reason: >
    A teacher-dependent required check (student_teacher_force_error) cannot be bound while the
    exact v5 teacher ("T1") identity is unresolved. The current three-lens gate must NOT run
    until the teacher identity is resolved and the profile is approved/frozen.
  system: SiO2 / SiO2-x
  legacy_source_repo: research-sio2-allegro-simplenn-distillation
  legacy_source_git: "71b96b3"
  note: >
    Criteria transcribed from the legacy v5 gate where a fixed reference+criterion exists;
    otherwise marked UNRESOLVED. The legacy "beat-original" rule is model-selection, not an
    absolute required-pass, and is not auto-imported as required.

observables:
  - name: student_teacher_force_error
    category: fidelity
    purpose: Student reproduces the teacher's forces (distillation fit)
    reference_source: teacher (Allegro) forces
    teacher_dependent: true
    protocol: force MAE / F_RMSE_V on held-out frames
    required: true
    # Teacher-dependent required check: the exact v5 teacher ("T1") identity is UNRESOLVED
    # (not hash-pinned in legacy evidence), so this check cannot be validly bound or run.
    blocks_gate_execution: true
    blocks_gate_execution_reason: "v5 teacher identity unresolved; current three-lens gate must not run until resolved"
    criterion: "F_RMSE_V <= ~0.31 eV/A (legacy reference 0.309; v5 measured ~0.285)"
    threshold_provenance: "gates/vote_v5.workflow.js:26 (criterion 3)"
    legacy_evidence_path: "teacher_diag/error_b_clean_simplenn_vs_allegro.csv"
    current_evidence_required: rerun on current baseline (requires resolved teacher)
    reusable_without_recomputation: true   # legacy CSV can seed the check; confirm scope labels

  - name: student_dft_force_error
    category: accuracy
    purpose: Student force error vs DFT (channel c)
    reference_source: DFT (reference set)
    protocol: force MAE vs DFT on the 11 AL cells (report scope/aggregation)
    required: true
    criterion: "error(c) <= 0.368 eV/A (v5 measured 0.337)"
    threshold_provenance: "gates/vote_v5.workflow.js:25 (criterion 2); coordination_votes.csv 2026-07-16"
    legacy_evidence_path: "sio2x_production/committee_u_out/v5_errorc/errorc_v5_committee_summary.csv"
    current_evidence_required: rerun on current baseline
    reusable_without_recomputation: true

  - name: committee_uncertainty_deployment
    category: reliability
    purpose: Committee force-disagreement over the deployment (random-sweep) distribution
    reference_source: 4-seed committee force std (u_max_mean per defect fraction x)
    protocol: mean over frames of per-frame max committee |F| std, x=0.03..0.24
    required: false            # DIAGNOSTIC: 0.30 is a paper aspiration, not an ADOPT blocker
    criterion: "aspiration u_max_mean < 0.30 eV/A (NOT required-pass); also report vs original"
    threshold_provenance: "gates/vote_v5.workflow.js:27,41 - explicitly non-binding aspiration"
    legacy_evidence_path: "sio2x_production/committee_u_out/v5_random_sweep/summary_random_sweep_4way.csv"
    current_evidence_required: rerun on current baseline (static committee eval; approval to load models)
    reusable_without_recomputation: true

  - name: committee_uncertainty_high_defect_subset
    category: reliability
    purpose: Committee disagreement on high-defect / clustered AL cells (residual concern)
    reference_source: 4-seed committee force std on 11 AL cells
    protocol: per-frame u_mean/u_max on AL11
    required: false            # DIAGNOSTIC
    criterion: "diagnostic only; residual u_max mean 0.334/med 0.321/p90 0.461 > 0.30 aspiration"
    threshold_provenance: "diagnostic; no required-pass threshold in legacy gate"
    legacy_evidence_path: "gpu_return_v5_committee/v5_committee_bundle/committee_umax_AL11_v5.log"
    current_evidence_required: rerun on current baseline (approval to load models)
    reusable_without_recomputation: true

  - name: nve_energy_drift
    category: md_stability
    purpose: Energy conservation in NVE
    reference_source: total-energy time series
    protocol: linear drift over ns
    required: true
    criterion: "|drift| < 1 meV/atom/ns (legacy measured -0.0049 +/- 0.0072, PASS)"
    threshold_provenance: "legacy physical-validation; STATUS.md / F11_nve_drift.csv"
    legacy_evidence_path: "teacher_diag/figs/F11_nve_drift.csv"
    current_evidence_required: rerun on current baseline trajectory
    reusable_without_recomputation: true

  - name: density
    category: physical
    purpose: Amorphous SiO2 mass density
    reference_source: quench NPT production; experiment ~2.20 g/cm3
    protocol: NPT quench density (UNRESOLVED exact cell/rate for a frozen band)
    required: false            # protocol/frozen band not pinned -> do not invent
    criterion: "reference values 2.20-2.23 g/cm3; frozen acceptance band UNRESOLVED"
    threshold_provenance: UNRESOLVED
    legacy_evidence_path: "sio2x_production/analysis_out/summary.csv"
    current_evidence_required: rerun; freeze band on approval
    reusable_without_recomputation: false

  - name: rdf_si_o
    category: physical
    purpose: Si-O first-neighbour structure
    reference_source: production MD RDF
    protocol: partial RDF Si-O first-peak position
    required: false            # tolerance band not pinned
    criterion: "reference first peak ~1.61 A; tolerance band UNRESOLVED"
    threshold_provenance: UNRESOLVED
    legacy_evidence_path: "teacher_diag/figs_hd (rdf partial)"
    current_evidence_required: rerun; freeze tolerance on approval
    reusable_without_recomputation: false

  - name: adf
    category: physical
    purpose: O-Si-O / Si-O-Si angular distribution
    reference_source: production MD ADF
    protocol: angle histograms
    required: false            # threshold not pinned
    criterion: "reference O-Si-O ~109, Si-O-Si ~144; tolerance UNRESOLVED"
    threshold_provenance: UNRESOLVED
    legacy_evidence_path: "sio2x_production/analysis_out/summary.csv"
    current_evidence_required: rerun; freeze tolerance on approval
    reusable_without_recomputation: false

  - name: throughput
    category: performance
    purpose: Student MD speed vs teacher
    reference_source: LAMMPS wall-time benchmark
    protocol: steps/s or ns/day at matched atoms/steps/hardware
    required: false            # diagnostic, not a scientific pass/fail
    criterion: "reported 51-59x speedup (diagnostic; hardware-dependent)"
    threshold_provenance: "diagnostic; not a gate criterion"
    legacy_evidence_path: "paper-repo work/speed_benchmark/out_*.log"
    current_evidence_required: optional; hardware-matched benchmark
    reusable_without_recomputation: true
