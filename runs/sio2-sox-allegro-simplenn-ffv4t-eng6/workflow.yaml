  gate:
    criteria:
    - PRIMARY_CLAIM Stage-8 PASS/FAIL is evaluated on the 1016-frame protected DFT holdout slice spanning all 8 frozen PRIMARY_CLAIM domains; cluster and silicon_others frames are diagnostic-only.
    - Domain membership is assigned by frozen frame/source identity -> source_category -> deployment-scope mapping; raw config_type is annotation only and unmapped or ambiguous provenance fails closed.
    - 'Student-vs-Teacher uses the frozen prospective per-domain caps: aligned energy RMSE <= 25.0 meV/atom and force-component RMSE <= 0.30 eV/Angstrom for every PRIMARY_CLAIM domain.'
    - Teacher-vs-DFT is required complete reference evidence on the same PRIMARY population and alignment convention, not a newly thresholded Stage-8 PASS criterion.
    - Student-vs-DFT reports direct metrics and the zero-margin triangle-inequality consistency envelope against Teacher-vs-DFT plus the frozen Student-vs-Teacher caps.
    - Energy alignment uses one common composition-aware elemental-fraction least-squares projection over the 1016-frame PRIMARY population for all three pairwise channels.
