  gate:
    criteria:
    - TeacherBaselineReport binds the exact Teacher config, distillation_scope, and validation_profile evidence used
    - Teacher calculator loads with the declared element/type mapping without runtime reconciliation or fallback
    - Teacher inference succeeds on every declared operational deployment slice with no NaN or Inf outputs
    - operational stability metrics are kept distinct from physical accuracy claims
    - no historical SiO2 numerical conclusion is imported as a fresh campaign result
  pydantic_ai:
    role: simulation
    action: build_teacher_baseline
    approval_boundary: costly_teacher_labeling
    idempotency_key: sio2-sox-allegro-simplenn-ffv4t:teacher_baseline:001
    parameters:
      teacher_config: '{run_dir}/inputs/004-teacher_config_reference.yaml'
      distillation_scope: '{run_dir}/inputs/007-distillation_scope.yaml'
      validation_profile: '{run_dir}/inputs/006-validation_profile.yaml'
      report_path: '{run_dir}/artifacts/teacher_baseline.json'
      labeled_output: '{run_dir}/artifacts/teacher_baseline_operational.extxyz'
      label_manifest_path: '{run_dir}/artifacts/teacher_baseline_labels.manifest.json'
      structures_path: '{run_dir}/inputs/039-operational_population_primary_claim.extxyz'
      reference_yaml: '{run_dir}/inputs/005-reference.yaml'
      deployment_domain:
        declared_domains:
        - amorphous_bulk_SiO2
        - crystalline_SiO2
        - high_pressure_SiO2
        - liquid_or_melt_SiO2
        - surface_SiO2
        - oxygen_vacancy_SiO2
        - amorphous_SiOx_sub_stoichiometric
        - condensed_pure_Si_boundary
        source_evidence: rule-grounded operational population (run-bound input 039; 9295 geometry-only frames) materialized deterministically per the frozen campaign spec docs/FRESH_CAMPAIGN_STAGE1_OPERATIONAL_POPULATION_RULE_v1 (01_stage1_operational_population_rule_v1.json). Rule = ALL sanitized-pool geometries whose config_type classifies ClaimRole.PRIMARY_CLAIM under the frozen DeploymentScopeContractV2, canonical-fingerprint-disjoint from the protected reconstructed Teacher TEST (1142 unique); no subsampling. Derivation 11424 source -> 10312 PRIMARY_CLAIM -> minus 1017 protected (1 dup-equivalent) -> 9295 final; population sha256 64f9df08cdd65304adb1a594ff86abc736b5d2a5478f1bd3cc0ed0cdb735f824; all 8 primary domains represented; leakage-free, ZERO DFT labels
        applicability_evidence_note: OPERATIONAL_ROBUSTNESS (finite Teacher inference, no NaN/Inf) is assessed over the FULL prospective PRIMARY_CLAIM source coverage (9295 frames across all 8 primary domains); the short-MD sanity subset is a bounded liveness check, not a per-class applicability claim. The 8 declared_domains are the frozen deployment scope; per-class physical-accuracy applicability remains NOT_ESTABLISHED at baseline.
        dft_labels_used: false
        protected_reference_labels_used: false
      applicability_status: NOT_ESTABLISHED
      applicability_limitations:
      - Teacher physical accuracy versus DFT is assessed in this campaign's dedicated reference_validation stage (ORIGINAL_HELDOUT_FIDELITY, Teacher-vs-DFT over the recovered original held-out TEST partition), NOT at teacher_baseline
      - full-envelope deployment applicability is NOT_ESTABLISHED at baseline; this stage asserts operational robustness (finite Teacher inference + short-MD sanity) only
      teacher_md_sanity:
        n_structures: 3
        temperature_K: 300.0
        timestep_fs: 0.5
        friction_per_fs: 0.01
        n_steps: 2000
        snapshot_interval: 100
        force_spike_threshold_eV_per_angstrom: 50.0
        min_distance_threshold_angstrom: 0.5
        seed: 20260821
      require_lineage: false
- name: reference_validation
  command: null
  outputs:
  - artifacts/reference_validation.json
  - artifacts/teacher_reference_predictions.extxyz
  teacher_validation_component:
  - TRAINING_CORPUS_CONSISTENCY
  - ORIGINAL_HELDOUT_FIDELITY
  contract:
    kind: validation_manifest
    manifest: artifacts/reference_validation.json
    validator: validation.reference_validation.validate_reference_validation_report
  gate:
    criteria:
    - Teacher-vs-DFT energy and force metrics are computed on the recovered original held-out TEST partition (recovered-original-holdout reference, target_split=test) using the current frozen Teacher checkpoint and the reference's own source DFT labels
    - the reference is the DFT-labeled EVALUATION population of the Teacher's own original held-out TEST split; its structure identities and DFT labels are hash-verified before any metric is computed
    - Teacher predictions on the held-out TEST are freshly computed for this campaign; no historical Teacher prediction, RMSE, MAE, or evaluation result is reused as the fresh campaign result
    - Teacher-vs-DFT metrics are reported globally and by config_type or declared structural domain
    - held-out TEST DFT truth is consumed only at this predictive-fidelity stage and is never exposed to the early blind Student route
  pydantic_ai:
    role: simulation
    action: validate_teacher_reference
    approval_boundary: costly_teacher_labeling
    idempotency_key: sio2-sox-allegro-simplenn-ffv4t:reference_validation:001
    parameters:
      teacher_config: '{run_dir}/inputs/004-teacher_config_reference.yaml'
      reference_yaml: '{run_dir}/inputs/040-reference.yaml'
      predictions_path: '{run_dir}/artifacts/teacher_reference_predictions.extxyz'
      report_path: '{run_dir}/artifacts/reference_validation.json'
      include_stress: false
    note: ORIGINAL_HELDOUT_FIDELITY execution binding. Serves the Teacher predictive-fidelity component the pre-campaign TeacherValidationPlan selects once the source held-out evidence is bound via teacher_evidence_sources. Reference = recovered-original-holdout (kind recovered-original-holdout, 1142 target_split=test frames with source DFT labels), the algorithmically reconstructed original Teacher held-out partition; Teacher-vs-DFT is computed fresh on the frozen Teacher checkpoint. This stage's costly Teacher inference is gated behind costly_teacher_labeling.
