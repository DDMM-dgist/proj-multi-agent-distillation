# Worked example — the SiO2 reference case's student.
# Copy to configs/student.<yours>.yaml and edit for your own model.
kind: simple-nn
train:
  env: distill-student-simplenn
  config_template: templates/student/simple-nn.input.yaml.template
  descriptor_params:
    Si: templates/student/params_Si     # 70 symmetry functions/element
    O:  templates/student/params_O
  total_epoch: 2000
  learning_rate: 0.0001
  double_precision: true
  batch_size: 32
  nodes: "30-30"
  use_stress: false
  read_stress: false
  stress_loss_weight: 0.0
  subprocesses: 0                    # benchmark 0/2/4/8 on the target filesystem before changing
  accurate_train_rmse: true          # affects reported train RMSE and stopping interpretation
  target_hours_per_seed: 12
  runner:
    module: adapters.simple_nn_v2_wrapper
committee:
  n_seeds: 4
deploy:
  lammps_pair_style: "nn"
  elements: [O, Si]                 # LAMMPS atom-type order; matches this case's production
                                     # data files (type 1 = O mass 15.999, type 2 = Si mass
                                     # 28.085) — never inferred alphabetically or assumed
predict:
  env: distill-student-simplenn
  command:
    - python
    - -m
    - adapters.simple_nn_v2_predict
    - --checkpoint
    - "{checkpoint}"
    - --structures
    - "{structures}"
    - --output
    - "{output}"
  energy_key: student_energy
  forces_key: student_forces
