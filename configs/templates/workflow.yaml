run_id: null
inputs: []
validation_contract_sources:  # bind before initialization: RunController.initialize() snapshots
  distillation_scope: null    # these three files into the run and freezes the write-once
  validation_profile: null    # validation_contract from them before any scientific stage runs.
  dataset_policy: null
stages:
  - name: teacher_baseline
    command: null
    outputs: [artifacts/teacher_baseline.json]
    contract:
      kind: validation_manifest
      manifest: artifacts/teacher_baseline.json
      validator: validation.teacher_baseline.validate_teacher_baseline_report
      options:
        validation_contract_path: "{run_dir}/validation_contract.json"
    gate:
      criteria: []  # bind applicability and target criteria before initialization
  - name: acquisition
    command: null
    outputs: []
    gate:
      criteria: []  # fill before initialization; criteria are snapshot-bound
  - name: data_coverage
    command: null
    outputs: [artifacts/data_coverage.json]
    contract:
      kind: validation_manifest
      manifest: artifacts/data_coverage.json
      validator: validation.data_coverage.validate_data_coverage_report
      options:
        validation_contract_path: "{run_dir}/validation_contract.json"
    gate:
      criteria: []
  - name: teacher_labeling
    command: null
    outputs: []
    gate:
      criteria: []
  - name: dataset_split
    command: null
    outputs: []
    gate:
      criteria: []
  - name: training
    command: null
    outputs: []
    produces_student_results: true
    gate:
      criteria: []
  - name: evaluation
    command: null
    outputs: []
    gate:
      criteria: []
  - name: uncertainty
    command: null
    outputs: []
    gate:
      criteria: []  # committee ranking/coverage; remove only when the run has no uncertainty branch
  - name: deployment_md
    command: null
    outputs: []
    contract: null  # normally md_manifest with checkpoint and trajectory/log evidence
    gate:
      criteria: []  # remove only when deployment does not involve MD
  - name: reference_validation
    command: null
    outputs: []
    contract: null  # optional DFT/experiment/reference evidence selected by the profile
    gate:
      criteria: []
  - name: physical_validation
    command: null
    outputs: []
    gate:
      criteria: []
  - name: analysis
    command: null
    outputs: []
    gate:
      criteria: []
